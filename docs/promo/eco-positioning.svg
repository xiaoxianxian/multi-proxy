<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="520" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">AI 出网的三层：有些闸门只有跑在你机器上才成立</text>

  <text x="40" y="72" font-size="14" font-weight="600" fill="#2563eb">① 你的机器（本地优先）</text>
  <rect x="40" y="86" width="300" height="62" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="58" y="112" font-size="14" font-weight="700" fill="#1e3a8a">本地 Coding Agent</text>
  <text x="58" y="134" font-size="12" fill="#475569">Codex / Cursor / Claude Desktop / OpenCode</text>

  <rect x="40" y="162" width="300" height="62" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="58" y="188" font-size="14" font-weight="700" fill="#065f46">multi-proxy（本地路由）</text>
  <text x="58" y="210" font-size="12" fill="#475569">端口冲突检测 · Ollama 一等公民 · 统一入口路由</text>

  <rect x="40" y="238" width="300" height="62" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="58" y="264" font-size="14" font-weight="700" fill="#065f46">Portico（本地控制面 · 旁路）</text>
  <text x="58" y="286" font-size="12" fill="#475569">确定性审计回放 · 出网管控 · 不进流量链</text>

  <text x="470" y="72" font-size="14" font-weight="600" fill="#64748b">② 云端 / 组织治理层（远端）</text>
  <rect x="470" y="162" width="250" height="138" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="488" y="190" font-size="14" font-weight="700" fill="#334155">火山 AgentKit / 阿里云 AI 网关</text>
  <text x="488" y="214" font-size="12" fill="#475569">多模型代理 · 密钥托管 · 计量分账</text>
  <text x="488" y="234" font-size="12" fill="#475569">MCP 管理 · 内容过滤 · 全链路日志</text>
  <text x="488" y="258" font-size="11" fill="#94a3b8">性能 / 成本数字均为“官方口径·非实测”</text>
  <text x="488" y="282" font-size="12" font-weight="700" fill="#b45309">⚠ 不在你机器上跑；专有云形态除外</text>

  <line x1="190" y1="148" x2="190" y2="162" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="190" y1="224" x2="190" y2="238" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <line x1="430" y1="56" x2="430" y2="430" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="430" y="250" font-size="11" fill="#94a3b8" transform="rotate(90 430 250)" text-anchor="middle">这几道闸门只有跑在你机器上才成立</text>

  <line x1="340" y1="193" x2="466" y2="225" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#b)"/>
  <text x="344" y="312" font-size="11" fill="#b45309">请求上行到上游（经不经过云网关都行）</text>

  <rect x="40" y="446" width="680" height="56" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="58" y="472" font-size="13" font-weight="700" fill="#92400e">云网关握合规分账，本地优先握账本主权——相邻两层，不互斥。</text>
  <text x="58" y="492" font-size="12" fill="#92400e">选型看你在哪一层：组织要合规分账选云网关；个人 / 小团队要账本握在自己手里选本地优先。</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/></marker>
  </defs>
</svg>

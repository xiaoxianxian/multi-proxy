<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Proxy Manager 启动中</title>
  <style>
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, sans-serif;
      background: #f8fafc;
      color: #334155;
      user-select: none;
      -webkit-app-region: drag; /* 无边框窗口：整块背景可拖动 */
    }
    .box { text-align: center; }
    .title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: .5px;
      color: #0f172a;
    }
    .accent { color: #2563eb; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 13px; }
    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="title">Proxy <span class="accent">Manager</span></div>
    <div class="spinner"></div>
    <div class="status">正在启动管理服务…</div>
    <div class="hint">127.0.0.1:18792</div>
  </div>
</body>
</html>

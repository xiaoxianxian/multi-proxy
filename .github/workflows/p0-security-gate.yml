# P0 安全门禁 CI（真实验证后写，命令均本地跑通）
# 9/26 修：cursor-proxy/.gitignore 忽略 dist/ → CI checkout 无 dist/server/start.js
#         → process-manager.js:41 探测 cursor = false → /api/installed 漏 cursor
#         → api.test.js:106 / e2e-scenarios.test.js:36 / api.test.js:67 必挂（9 封邮件根因）
#         修法：cursor job 构建 dist + upload-artifact，manager job needs cursor + download-artifact
# 9/27 加 shell job：run tests/shell/check.sh（zero-dep CJK-safe 本机 15/15 绿，bats 无 bats 时的官方回退门禁）
name: P0 Security Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  codex:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: codex-proxy/package-lock.json
      - name: P0 gate + full
        run: |
          cd codex-proxy
          npm ci
          npx jest tests/config-leak-gate.test.js --verbose --forceExit
          npx jest --silent --forceExit

  cursor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cursor-proxy/package-lock.json
      - name: P0-E drift + build dist + upload artifact
        run: |
          cd cursor-proxy
          npm ci
          NODE_OPTIONS=--experimental-vm-modules npx jest tests/unit/pricing-cache-drift.test.ts --verbose --forceExit
           # 构建 dist 产物（dist/ 被 gitignore，CI 无此文件）
           # 产物：cursor-proxy/dist/server/start.js
          npm run build
          test -f dist/server/start.js && echo "cursor dist start.js built ok" || { echo "FAIL: cursor dist/server/start.js missing"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: cursor-dist
          path: cursor-proxy/dist/
          if-no-files-found: error

  hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pytest
        run: |
          pip install pytest
          pip install -r hermes-proxy/requirements.txt
          cd hermes-proxy && python -m pytest -q

  l2:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: run all l2 demos
        run: |
          fail=0
          n=0
          for f in l2/*.demo.js; do
            n=$((n+1))
            echo "[$n] $(basename $f)"
            node "$f" || { echo "FAIL $f"; fail=1; }
          done
          if [ "$fail" -eq 0 ]; then echo "$n l2 demo OK"; else echo "l2 FAIL ($n total)"; exit 1; fi

  manager:
    needs: [cursor]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # 2026-10-08 修：manager 有 2 个 ESM suite（skill-service-route / frontend.logs），
      # 跨-suite 并行时不带 --experimental-vm-modules 会偶发挂（实测 1324/1326，
      # 带 vmodules 则 1326/1326 恒绿）。--rerunFailsAtMost=2 压不平——是 ESM 加载
      # 确定性失败，非网络/时序偶发。feature-matrix 早已记「manager 须 vmodules」，CI 漏带 → 假红。
      NODE_OPTIONS: --experimental-vm-modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: multi-proxy-manager/package-lock.json
      - name: download cursor dist artifact
        uses: actions/download-artifact@v4
        with:
          name: cursor-dist
          path: cursor-proxy/dist/
      - name: manager full suite
        run: |
          cd multi-proxy-manager
          npm ci
            # cursor-dist artifact 已落 cursor-proxy/dist/server/start.js
            # → process-manager.js:41 fs.existsSync = true → PROXY_CONFIGS 含 cursor
            # → api.test.js:106 / e2e-scenarios.test.js:36 / api.test.js:67 全绿
            # 跨 test module-level flaky ~10%，retry 3 次压平；不碰热路径不碰门控
          npx jest --silent --forceExit --rerunFailsAtMost=2

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: shell script gate (check.sh + bats)
        run: |
          bash tests/shell/check.sh
          npm install -g bats >/dev/null 2>&1 || true
          if command -v bats >/dev/null 2>&1; then
            bats tests/shell/manage.sh.test.bats
          else
            echo "bats unavailable; check.sh already validated above"
          fi

  # 内部资产 push 闸门（2026-09-28 维护者拍板升级）：
  # 与 .gitignore「内部资产：永不提交」段同源。该段每加一条规则，本 job 自动多查一类。
  # 防 `git add -f` / 手工夹带 / 规则新增后漏 untrack 的存量文件进公开树。
  internal-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: push-gate check (internal assets must not be tracked)
        run: bash scripts/push-gate-check.sh HEAD

  # 版权头闸门（2026-10-09 加）：确保所有公开树源码/文档都带 AGPL+商业双许可头。
  # 与 scripts/add-copyright-header.sh 同源；该脚本的 dry-run 候选数必须为 0（frontmatter 文件已跳过）。
  license-header:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: check no missing copyright headers
        run: |
          out=$(bash scripts/add-copyright-header.sh)
          echo "$out"
          n=$(echo "$out" | grep '候选文件数:' | awk -F'[: ]+' '{print $NF}')
          if [ "$n" -ne 0 ]; then
            echo "FAIL: $n file(s) missing copyright header — run: DRY_RUN=false bash scripts/add-copyright-header.sh"; exit 1
          fi
          echo "license-header OK (0 missing)"

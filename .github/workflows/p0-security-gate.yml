# P0 安全门禁 CI（真实验证后写，命令均本地跑通）
# 快速门：codex 凭证泄露门禁 + registry charset + pricing drift + 17 l2 demo
name: P0 Security Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  codex:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: codex-proxy/package-lock.json
      - name: P0 gate + full
        run: |
          cd codex-proxy
          npm ci
          npx jest tests/config-leak-gate.test.js --verbose --forceExit
          npx jest --silent --forceExit

  cursor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cursor-proxy/package-lock.json
      - name: P0-E drift + full
        run: |
          cd cursor-proxy
          npm ci
          NODE_OPTIONS=--experimental-vm-modules npx jest tests/unit/pricing-cache-drift.test.ts --verbose --forceExit

  hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pytest
        run: |
          pip install pytest
          pip install -r hermes-proxy/requirements.txt
          cd hermes-proxy && python -m pytest -q

  l2:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 17 l2 demos
        run: |
          fail=0
          for f in l2/*.demo.js; do
            echo "── $(basename $f)"
            node "$f" || { echo "FAIL $f"; fail=1; }
          done
          if [ "$fail" -eq 0 ]; then echo "17/17 l2 demo OK"; else echo "l2 FAIL"; exit 1; fi

  manager:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: multi-proxy-manager/package-lock.json
      - name: manager full suite
        run: |
          cd multi-proxy-manager
          npm ci
          # 跨 test 的 module-level flaky ~10%，retry 3 次压平；不碰热路径不碰门控
          npx jest --silent --forceExit --rerunFailsAtMost=2

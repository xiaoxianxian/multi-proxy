<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self' data:;">
  <title>Multi-Proxy Manager - 法务与许可</title>
  <style>
    :root {
      --bg-base: #0c0f16; --bg-soft: #141925; --bg-raised: #1b2233;
      --border-soft: #262e40; --border: #333d52; --border-strong: #4a5670;
      --text: #e6ebf3; --text-dim: #9aa4b8; --text-mute: #6a758c;
      --brand-start: #7c5cff; --brand-end: #5b8cff; --accent: #6ea8ff;
      --ok: #49c290; --warn: #e0b341; --danger: #e0567a;
      --font-ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, system-ui, sans-serif;
      --font-mono: "SF Mono", "JetBrains Mono", "Fira Code", ui-monospace, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font-ui); color: var(--text); background:
      radial-gradient(1100px 640px at 18% -8%, rgba(124,92,255,.13), transparent 60%),
      radial-gradient(900px 560px at 108% 4%, rgba(91,140,255,.11), transparent 55%),
      var(--bg-base); line-height: 1.65; -webkit-font-smoothing: antialiased; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 36px 28px 64px; }

    /* —— 返回 + 标题 —— */
    .top { display:flex; align-items:center; gap:14px; margin-bottom: 6px; }
    .back { background: none; border: 1px solid var(--border); color: var(--text-dim); font-family: var(--font-ui);
      font-size: 13px; padding: 7px 13px; border-radius: 10px; cursor: pointer; text-decoration: none; transition: all .15s; }
    .back:hover { color: var(--text); border-color: var(--border-strong); }
    .head-h { font-size: 20px; font-weight: 700; }
    .sub { font-size: 13.5px; color: var(--text-dim); margin: 10px 0 22px; }

    /* —— tab —— */
    .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
    .tab { flex: 0 0 auto; background: none; border: 1px solid transparent; color: var(--text-dim);
      font-family: var(--font-ui); font-size: 14px; font-weight: 600; padding: 9px 16px; border-radius: 10px;
      cursor: pointer; transition: all .15s; }
    .tab:hover { color: var(--text); background: var(--bg-soft); }
    .tab.active { color: #fff; background: linear-gradient(135deg, var(--brand-start), var(--brand-end));
      border-color: rgba(124,92,255,.5); box-shadow: 0 4px 16px rgba(91,140,255,.22); }

    /* —— 版本 chip + 在线兜底 —— */
    .bar { display:flex; align-items:center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px;
      font-size: 12.5px; color: var(--text-mute); }
    .ver { font-family: var(--font-mono); color: var(--text-dim); background: var(--bg-soft);
      border: 1px solid var(--border); padding: 3px 9px; border-radius: 7px; font-size: 12px; }
    .fallback { padding: 16px 18px; border: 1px solid var(--warn); border-radius: 12px; background: rgba(224,179,65,.07);
      font-size: 13.5px; color: var(--text); margin-bottom: 18px; }
    .fallback a { color: var(--accent); text-decoration: none; }
    .fallback a:hover { text-decoration: underline; }

    /* —— 法务正文（服务端已安全渲染，此处仅样式）—— */
    .doc { background: var(--bg-soft); border: 1px solid var(--border-soft); border-radius: 14px;
      padding: 26px 30px; }
    .doc h1.legal-h { font-size: 19px; font-weight: 700; margin: 0 0 14px; padding: 0 0 12px; border-bottom: 1px solid var(--border-soft); }
    .doc h2.legal-h { font-size: 16px; font-weight: 700; margin: 26px 0 10px; }
    .doc h3.legal-h { font-size: 14.5px; font-weight: 600; margin: 20px 0 8px; color: var(--text); }
    .doc h4.legal-h { font-size: 13.5px; font-weight: 600; margin: 16px 0 6px; color: var(--text-dim); }
    .doc p.legal-p { margin: 0 0 12px; font-size: 13.5px; color: var(--text); }
    .doc ul.legal-list { margin: 0 0 12px; padding-left: 22px; }
    .doc li { font-size: 13.5px; margin-bottom: 6px; color: var(--text); }
    .doc blockquote.legal-quote { margin: 0 0 12px; padding: 10px 14px; border-left: 3px solid var(--border-strong);
      background: var(--bg-base); border-radius: 0 8px 8px 0; color: var(--text-dim); font-size: 13px; }
    .doc hr.legal-hr { border: none; border-top: 1px solid var(--border-soft); margin: 24px 0; }
    .doc strong { color: var(--text); font-weight: 700; }
    .doc em { color: var(--text-dim); }
    .doc code { font-family: var(--font-mono); font-size: 12.5px; background: var(--bg-raised);
      border: 1px solid var(--border-soft); padding: 1px 6px; border-radius: 5px; color: var(--accent); }
    .doc table.legal-table { width: 100%; border-collapse: collapse; margin: 8px 0 16px; font-size: 12.5px;
      border: 1px solid var(--border-soft); border-radius: 10px; overflow: hidden; }
    .doc th { background: var(--bg-raised); color: var(--text); text-align: left; font-weight: 600;
      padding: 9px 12px; border-bottom: 1px solid var(--border); }
    .doc td { color: var(--text-dim); padding: 9px 12px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
    .doc tr:last-child td { border-bottom: none; }
    .doc thead th { border-top: none; }
    .doc table.legal-table tr:nth-child(even) td { background: rgba(255,255,255,.015); }

    .loading { color: var(--text-mute); font-size: 13px; padding: 20px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <button class="back" onclick="window.location='/consent'">← 返回首启页</button>
      <div class="head-h">关于 · 法务</div>
    </div>
    <div class="sub">本地优先 · 法务条款以本机 <code>docs/legal/</code> 定稿文本为源，零网络、零第三方读取。</div>

    <div class="tabs" role="tablist">
      <button class="tab active" data-type="terms" role="tab">用户服务协议</button>
      <button class="tab" data-type="privacy" role="tab">隐私政策</button>
    </div>

    <div class="bar">
      <span class="ver" id="ver">—</span>
      <a href="https://www.sifking.cn" target="_blank" rel="noopener" style="color:var(--text-mute);text-decoration:none;">www.sifking.cn ↗</a>
    </div>

    <div class="doc" id="doc"><div class="loading">加载中…</div></div>
  </div>

  <script>
    var current = 'terms';
    var initialTab = (new URLSearchParams(window.location.search).get('tab') === 'privacy') ? 'privacy' : 'terms';
    document.querySelectorAll('.tab').forEach(function (b) {
      b.addEventListener('click', function () {
        document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('active'); });
        b.classList.add('active');
        load(b.dataset.type);
       });
     });
    function load(type) {
      current = type;
      var doc = document.getElementById('doc');
      doc.innerHTML = '<div class="loading">加载中…</div>';
      fetch('/api/legal?type=' + encodeURIComponent(type))
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (data) {
          if (current !== type) return; // 防竞态：切 tab 后旧请求不回写
          var el = document.getElementById('doc');
          document.getElementById('ver').textContent = data.version || '';
           if (data.fallback) {
            // 本地法务文本缺失/未打包 → 不断链，指向官方在线版
            el.innerHTML =
              '<div class="fallback">' +
              '本地法务文本暂缺（' + escapeHtml(data.title || type) + '）。' +
              '  ' + escapeHtml(data.reason || '') +
              '  请前往官网查看：<a href="' + escapeAttr(data.online || 'https://www.sifking.cn') +
              '" target="_blank" rel="noopener">www.sifking.cn ↗</a></div>';
            return;
          }
           el.innerHTML = data.html || '<div class="loading">（空）</div>';
        })
        .catch(function (err) {
          var el = document.getElementById('doc');
          el.innerHTML = '<div class="fallback">法务文本加载失败：' + escapeHtml(String(err.message || err)) +
            '。请确认面板正常启动，或前往 <a href="https://www.sifking.cn" target="_blank" rel="noopener">官网 ↗</a> 查阅。</div>';
        });
      }
    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
     }
    function escapeAttr(s) {
      return escapeHtml(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
     }
     load(initialTab);
  </script>
</body>
</html>

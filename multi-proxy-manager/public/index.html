<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proxy Manager</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Ctext x='16' y='24' font-size='20' font-weight='bold' text-anchor='middle' fill='white' font-family='Arial,sans-serif'%3EP%3C/text%3E%3C/svg%3E" type="image/svg+xml">
  <!-- 别名桥：旧 token 留、新 token 并存（与其他页一致） -->
  <link rel="stylesheet" href="./colors_and_type.css">
  <link rel="stylesheet" href="./shared-styles.css">
  <link rel="stylesheet" href="./tokens.css">
  <link rel="stylesheet" href="./components.css">
  <style>
    :root{ --mp-bg:var(--color-bg,#0e1116); --mp-fg:var(--color-fg,#e7ecf3); --mp-accent:var(--color-primary,#2563eb); --mp-faint:var(--color-fg,#8a94a6); }
    *{ box-sizing:border-box; }
    body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:var(--mp-bg); color:var(--mp-fg);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
    .entry{ width:min(420px,90vw); text-align:center; }
    .brand{ display:inline-flex; align-items:center; gap:12px; font-size:22px; font-weight:700; letter-spacing:.3px; }
    .brand svg{ width:34px; height:34px; }
    .subtitle{ margin-top:10px; color:var(--mp-faint); font-size:14px; line-height:1.5; }
    .status{ display:inline-flex; align-items:center; gap:8px; margin-top:18px; font-size:13px; color:var(--mp-faint); }
    .dot{ width:9px; height:9px; border-radius:50%; background:#8a94a6; }
    .dot.on{ background:#22c55e; } .dot.off{ background:#ef4444; }
    .links{ margin-top:26px; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
    .links a{ font-size:13px; color:var(--mp-fg); text-decoration:none; padding:7px 13px;
      border:1px solid var(--color-border,#26303f); border-radius:8px; transition:.15s; }
    .links a:hover{ border-color:var(--mp-accent); color:var(--mp-accent); }
    .spin{ width:26px; height:26px; margin:22px auto 0; border:3px solid var(--color-border,#26303f);
      border-top-color:var(--mp-accent); border-radius:50%; animation:mspin .8s linear infinite; }
    @keyframes mspin{ to{ transform:rotate(360deg); } }
    @media (prefers-reduced-motion:reduce){ .spin{ animation:none; } }
    [data-theme="dark"] body, .dark body{ --mp-bg:#0b0f14; --mp-fg:#e7ecf3; --mp-faint:#8a94a6; }
  </style>
</head>
<body>
  <div class="entry">
    <div class="brand">
      <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="8" fill="#2563eb"/><text x="16" y="24" font-size="20" font-weight="bold" text-anchor="middle" fill="white" font-family="Arial,sans-serif">P</text></svg>
      Proxy Manager
    </div>
    <div class="subtitle">正在进入控制台…</div>
    <div class="status"><span id="statusDot" class="dot"></span><span id="statusText">连接中…</span></div>
    <div class="links" aria-label="快捷入口">
      <a href="./dashboard.html">控制台</a>
      <a href="./floor.html">指标</a>
      <a href="./logs.html">日志</a>
      <a href="./sessions.html">会话</a>
      <a href="./skills.html">技能</a>
      <a href="./settings.html">设置</a>
    </div>
    <div class="spin" aria-hidden="true"></div>
  </div>

  <script>
    // 真实仍 redirect：入口屏仅作品牌过渡，行为保持原样——立即跳 dashboard（无密码时 dashboard 再级联 login）。
    // 服务连接指示：非阻塞尽力 fetch /api/status，resolve 时亮绿、失败红，绝不阻塞重定向（catch 兜底，不破 e2e 即时重定向期望）。
    (function () {
      'use strict';
      fetch('/api/status')
        .then(function (r) { return r.status === 200 ? r.json() : Promise.reject(); })
        .then(function () {
          var dot = document.getElementById('statusDot');
          var txt = document.getElementById('statusText');
          if (dot) dot.classList.add('on');
          if (txt) txt.textContent = '已连接 · 进入控制台';
        })
        .catch(function () {
          var dot = document.getElementById('statusDot');
          var txt = document.getElementById('statusText');
          if (dot) dot.classList.add('off');
          if (txt) txt.textContent = '连接中（稍候重试）';
        });
      // 即时重定向（无延迟）：保持 / → dashboard →（无密码）login 级联，不破 auth-flow e2e。
      window.location.replace('dashboard.html');
    })();
  </script>
</body>
</html>

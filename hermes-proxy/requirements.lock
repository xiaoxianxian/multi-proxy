# 这个文件是生成物，不要手改。源是 hermes-proxy/requirements.txt（只列直接依赖），
# 重新生成：uv pip compile hermes-proxy/requirements.txt --universal -o hermes-proxy/requirements.lock
#
# 为什么要有它：requirements.txt 只钉 3 个直接依赖，Flask/requests 各自的传递依赖
# （werkzeug/jinja2/urllib3/certifi/...）在过去是自由解析的。LiteLLM 投毒事件
# （2026-10-21）的攻击链正是从这一个洞打进来的——恶意版本只在 PyPI 上活了
# 1 小时 44 分钟，任何在那期间自由解析依赖的构建都会中。全锁定之后，装的就是
# 这里写的版本，恶意版本连被考虑的机会都没有。
#
# CI（.github/workflows/p0-security-gate.yml 的 hermes job）和 install.sh
# 都从这个文件安装，不再从 requirements.txt 装。

